<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>RLP Component Library</title>
<link rel="stylesheet" href="css/styles.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Public+Sans:ital,wght@0,400;0,600;0,700;1,400&display=swap" rel="stylesheet">
<style>
  html { box-sizing: border-box; font-size: 10px; }
  body { margin: 0; background: #f9f9f7; color: #1b1b1b;

  a { color: #1a4480; }
  .lib-app { height: 100vh; display: flex; flex-direction: column; overflow: hidden; }
  .lib-top { flex: 0 0 auto; display: flex; align-items: center; gap: 20px; padding: 0 24px; height: 58px; background: #1a4480; color: #fff; }
  .lib-top__brand { display: flex; align-items: center; gap: 10px; font-size: 15px; font-weight: 700; letter-spacing: -0.01em; }
  .lib-top__tag { font-size: 11.5px; letter-spacing: 0.06em; text-transform: uppercase; color: #c6d5ea;
    border-left: 1px solid rgba(255,255,255,0.25); padding-left: 20px; }
  .lib-top__count { margin-left: auto; font-size: 12px; color: #c6d5ea; font-variant-numeric: tabular-nums; }
  .lib-body { flex: 1; min-height: 0; display: flex; }
  .lib-index { flex: 0 0 306px; width: 306px; background: #fff; border-right: 1px solid #dfe1e2; display: flex; flex-direction: column; min-height: 0; }
  .lib-index__search { padding: 14px 16px 12px; border-bottom: 1px solid #dfe1e2; display: flex; flex-direction: column; gap: 10px; }
  .lib-index__search input { width: 100%; height: 36px; padding: 0 10px; font: inherit; font-size: 13px;
    border: 1px solid #565c65; border-radius: 3px; box-sizing: border-box; }
  .lib-az { display: flex; flex-wrap: wrap; gap: 3px; }
  .lib-az a, .lib-az span { display: inline-flex; align-items: center; justify-content: center; width: 20px; height: 20px;
    border-radius: 2px; font-size: 11px; font-weight: 700; text-decoration: none; }
  .lib-az a { background: #1a4480; color: #fff; }
  .lib-az a:hover { background: #16324f; }
  .lib-az span { background: #eff1f1; color: #b4b8bb; }
  .lib-index__list { flex: 1; overflow-y: auto; padding: 8px 0 40px; }
  .lib-group { margin-bottom: 6px; scroll-margin-top: 8px; }
  .lib-group__head { position: sticky; top: 0; background: #fff; display: flex; align-items: center; justify-content: space-between;

  .lib-item { display: block; width: 100%; text-align: left; font: inherit; font-size: 13.5px; padding: 7px 16px;
    border: none; border-left: 3px solid transparent; background: none; color: #3d4551; cursor: pointer; }
  .lib-item:hover { background: #f0f3f8; }
  .lib-item.is-active { font-weight: 700; border-left-color: #1a4480; background: #f0f3f8; color: #1a4480; }
  .lib-main { flex: 1; min-width: 0; overflow-y: auto; }
  .lib-pane { padding: 32px 40px 90px; max-width: 1180px; }
  .lib-pane h1 { margin: 0 0 8px; font-size: 26px; font-weight: 700; letter-spacing: -0.02em; color: #1b1b1b; }
  .lib-source { margin: 0 0 24px; display: flex; align-items: center; gap: 8px;
    font-family: ui-monospace, Menlo, Consolas, monospace; font-size: 12.5px; color: #71767a; }
  .lib-source__badge { font-size: 10.5px; font-weight: 700; letter-spacing: 0.08em; color: #3d4551;
    background: #eff1f1; border: 1px solid #dfe1e2; border-radius: 2px; padding: 3px 7px; }
  .lib-stage { background: #fff; border: 1px solid #dfe1e2; border-radius: 5px; padding: 34px 32px; margin-bottom: 10px; overflow: auto; }

  .lib-stage__label { margin: 0 0 30px; font-size: 11.5px; letter-spacing: 0.06em; text-transform: uppercase; color: #71767a; }
  .lib-split { display: grid; grid-template-columns: minmax(0, 1.45fr) minmax(280px, 1fr); gap: 26px; align-items: start; }
  .lib-h2 { margin: 0; font-size: 13px; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; color: #1b1b1b; }
  .lib-codehead { display: flex; align-items: center; justify-content: space-between; margin-bottom: 9px; }
  .lib-copy { font: inherit; font-size: 12.5px; font-weight: 700; color: #1a4480; background: #fff;

  .lib-notes { background: #fff; border: 1px solid #dfe1e2; border-radius: 5px; padding: 18px; display: flex; flex-direction: column; gap: 12px; }
  .lib-notes p { margin: 0; font-size: 13.5px; line-height: 1.65; color: #3d4551; white-space: pre-wrap; text-wrap: pretty; }
  .lib-flag { background: #fef0c8; border-left: 3px solid #c2850c; color: #543a00; padding: 11px 13px; border-radius: 2px;

  .lib-row--status { display: grid; grid-template-columns: 34px minmax(0, 120px) minmax(0, 1fr) minmax(0, 1.1fr);

  .lib-swatch { width: 30px; height: 30px; border-radius: 3px; border: 1px solid rgba(0,0,0,0.12); }
  .lib-mono { font-family: ui-monospace, Menlo, Consolas, monospace; font-size: 12.5px; font-weight: 700; min-width: 0; }
  .lib-mono--sm { font-family: ui-monospace, Menlo, Consolas, monospace; font-size: 11.5px; font-weight: 400;

  .lib-cell { min-width: 0; font-size: 14px; line-height: 1.55; color: #3d4551; }
  .lib-iconbox { width: 40px; height: 40px; display: flex; align-items: center; justify-content: center; background: #f6f6f4; border-radius: 3px; }
  .lib-subhead { margin: 0 0 12px; font-size: 13px; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; color: #1a4480; }

function esc(s) { return String(s).replace(/[&<>]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;' }[c])); }

function parseNotes(notes) {
  let source = '', rest = notes || '';
  const m = rest.match(/^SOURCE[^\n]*/);
  if (m) { source = m[0].replace(/^SOURCE(\s*\(canonical\))?:\s*/, ''); rest = rest.slice(m[0].length).trim(); }
  const paras = [], flags = [];
  rest.split(/\n\s*\n/).filter(Boolean).forEach(t => {
    (/^(GAP:|RESOLVED|Flag to Daniel)/.test(t.trim()) ? flags : paras).push(t.trim());
  });
  return { source: source || '\u2014', paras: paras, flags: flags };
}

COMPONENTS.sort((a, b) => a.name.localeCompare(b.name));

const state = { q: '', sel: COMPONENTS[0].name, view: 'component' };

const indexList = document.getElementById('lib-index-list');
const azStrip = document.getElementById('lib-az');
const main = document.getElementById('lib-main');
const countEl = document.getElementById('lib-count');
const searchEl = document.getElementById('lib-search');

function filtered() {
  const q = state.q.trim().toLowerCase();
  return COMPONENTS.filter(c => !q || c.name.toLowerCase().includes(q) || (c.notes || '').toLowerCase().includes(q));
}

function renderIndex() {
  const list = filtered();
  const letters = [...new Set(list.map(c => c.name[0].toUpperCase()))];
  let az = '';
  for (let i = 65; i <= 90; i++) {
    const L = String.fromCharCode(i);
    az += letters.includes(L) ? '<a href="#letter-' + L + '">' + L + '</a>' : '<span>' + L + '</span>';
  }
  azStrip.innerHTML = az;

  indexList.innerHTML = letters.map(L => {
    const items = list.filter(c => c.name[0].toUpperCase() === L);
    return '<div class="lib-group" id="letter-' + L + '">' +
      '<div class="lib-group__head"><span>' + L + '</span><span>' + items.length + '</span></div>' +
      items.map(c => '<button type="button" class="lib-item' +
        (state.view === 'component' && state.sel === c.name ? ' is-active' : '') +
        '" data-name="' + esc(c.name) + '">' + esc(c.name) + '</button>').join('') +
      '</div>';
  }).join('') +
    '<div class="lib-group__head" style="position:static;border-bottom:none;padding-top:14px"><span>FOUNDATIONS</span></div>' +
    '<button type="button" class="lib-item' + (state.view === 'status' ? ' is-active' : '') + '" data-view="status">Status Colors</button>' +
    '<button type="button" class="lib-item' + (state.view === 'icons' ? ' is-active' : '') + '" data-view="icons">Icon Library</button>';

  const q = state.q.trim();
  countEl.textContent = q ? list.length + ' of ' + COMPONENTS.length + ' components'
    : COMPONENTS.length + ' components \u00b7 ' + ICONS.length + ' icons';
}

function renderMain() {
  if (state.view === 'status') {
    main.innerHTML = '<div class="lib-pane"><h1>Status Colors</h1>' +
      '<p class="lib-intro">Semantic status-text mapping from <code>css/styles.css</code> (~line 836). Map a new status value to the closest group below \u2014 don\'t invent a new color.</p>' +
      '<div class="lib-card">' + STATUSES.map(s => {
        const name = s.title.split('\u2014')[1] ? s.title.split('\u2014')[1].trim() : '';
        return '<div class="lib-row--status">' +
          '<div class="lib-swatch" style="background:' + s.hex + '"></div>' +
          '<div style="min-width:0"><div class="lib-mono">' + s.hex + '</div><div style="font-size:12px;color:#71767a;margin-top:3px">' + esc(name) + '</div></div>' +
          '<div class="lib-cell"><div style="font-size:15px;font-weight:700;color:' + s.hex + ';margin-bottom:5px">' + esc(s.sample) + '</div>' + esc(s.labels) + '</div>' +
          '<div class="lib-mono--sm">' + esc(s.classes) + '</div></div>';
      }).join('') + '</div></div>';
    return;
  }
  if (state.view === 'icons') {
    const groups = [...new Set(ICONS.map(i => i.group))];
    main.innerHTML = '<div class="lib-pane"><h1>Icon Library</h1>' +
      '<p class="lib-intro">Every file in <code>assets/</code>, grouped by what it\'s used for \u2014 labels pulled from real aria-label / Icon Key text. Icons used for more than one action list every label found; reuse them the same way.</p>' +
      groups.map(g => '<div style="margin-bottom:30px"><h2 class="lib-subhead">' + esc(g) + '</h2><div class="lib-card">' +
        ICONS.filter(i => i.group === g).map(i => '<div class="lib-row--icon">' +
          '<div class="lib-iconbox"><img src="assets/' + i.file + '" alt="" width="' + i.w + '" height="' + i.h + '"' +
          (i.h > 40 ? ' style="width:40px;height:40px;object-fit:cover"' : '') + '></div>' +
          '<div class="lib-mono" style="overflow-wrap:anywhere">' + esc(i.file) + '</div>' +
          '<div class="lib-cell" style="font-size:13.5px">' + esc(i.labels) + '</div></div>').join('') +
        '</div></div>').join('') + '</div>';
    return;
  }
  const c = COMPONENTS.find(x => x.name === state.sel) || COMPONENTS[0];
  const p = parseNotes(c.notes);
  main.innerHTML = '<div class="lib-pane">' +
    '<h1>' + esc(c.name) + '</h1>' +
    '<p class="lib-source"><span class="lib-source__badge">SOURCE</span>' + esc(p.source) + '</p>' +
    '<div class="lib-stage">' + c.preview + '</div>' +
    '<p class="lib-stage__label">Rendered preview</p>' +
    '<div class="lib-split"><div>' +
      '<div class="lib-codehead"><h2 class="lib-h2">HTML</h2><button type="button" class="lib-copy" id="lib-copy">Copy HTML</button></div>' +
      '<pre><code>' + esc(c.code) + '</code></pre>' +
    '</div><aside>' +
      '<h2 class="lib-h2" style="margin-bottom:9px">Notes</h2><div class="lib-notes">' +
      p.paras.map(t => '<p>' + esc(t) + '</p>').join('') +
      p.flags.map(t => '<div class="lib-flag">' + esc(t) + '</div>').join('') +
      '</div></aside></div></div>';

  const copyBtn = document.getElementById('lib-copy');
  copyBtn.addEventListener('click', () => {
    navigator.clipboard.writeText(c.code).then(() => {
      copyBtn.textContent = 'Copied';
      setTimeout(() => { copyBtn.textContent = 'Copy HTML'; }, 1500);
    });
  });
}

function render() { renderIndex(); renderMain(); }

indexList.addEventListener('click', e => {
  const btn = e.target.closest('.lib-item');
  if (!btn) return;
  if (btn.dataset.view) { state.view = btn.dataset.view; }
  else { state.view = 'component'; state.sel = btn.dataset.name; main.scrollTop = 0; }
  render();
});

searchEl.addEventListener('input', function () { state.q = this.value; renderIndex(); });

azStrip.addEventListener('click', e => {
  const a = e.target.closest('a');
  if (!a) return;
  e.preventDefault();
  const target = document.getElementById(a.getAttribute('href').slice(1));
  if (target) indexList.scrollTop = target.offsetTop - indexList.offsetTop;
});

/* Demo wiring for interactive previews */
document.addEventListener('click', e => {
  const acc = e.target.closest('.usa-accordion__button');
  if (acc) {
    const ex = acc.getAttribute('aria-expanded') === 'true';
    const box = document.getElementById(acc.getAttribute('aria-controls'));
    acc.setAttribute('aria-expanded', ex ? 'false' : 'true');
    if (box) { ex ? box.setAttribute('hidden', '') : box.removeAttribute('hidden'); }
    return;
  }
  const seg = e.target.closest('.demo-segment');
  if (seg) {
    (seg.closest('.usa-button-group') || document).querySelectorAll('.demo-segment').forEach(b => b.classList.remove('active'));
    seg.classList.add('active');
    return;
  }
  const tab = e.target.closest('.demo-tab');
  if (tab) {
    const scope = tab.closest('.lib-stage') || document;
    scope.querySelectorAll('.demo-tab').forEach(t => t.classList.remove('active'));
    scope.querySelectorAll('.demo-panel').forEach(pn => { pn.classList.remove('active'); pn.style.display = 'none'; });
    tab.classList.add('active');
    const panel = scope.querySelector('.demo-panel[data-panel="' + tab.dataset.tab + '"]');
    if (panel) { panel.classList.add('active'); panel.style.display = 'block'; }
    return;
  }
  const mo = e.target.closest('[data-modal-open]');
  if (mo) { const el = document.getElementById(mo.dataset.modalOpen); if (el) el.removeAttribute('hidden'); return; }
  const mc = e.target.closest('[data-modal-close]');
  if (mc) { const ov = mc.closest('.modal-overlay'); if (ov) ov.setAttribute('hidden', ''); }
});

render();
